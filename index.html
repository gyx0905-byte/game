<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✊✋✌️ 剪刀石頭布 終極大對決 — 冒險者網頁版</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #283548;
      --border-subtle: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-gold-soft: rgba(245, 158, 11, 0.15);
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-green-soft: rgba(16, 185, 129, 0.15);
      --accent-red: #f43f5e;
      --accent-red-soft: rgba(244, 63, 94, 0.15);
      --accent-purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 48px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, #fde68a, #f59e0b, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Setup Screen */
    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .name-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .name-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .equip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .equip-card {
      background: #0f172a;
      border: 2px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .equip-card:hover {
      border-color: #64748b;
      transform: translateY(-2px);
    }

    .equip-card.selected {
      border-color: var(--accent-gold);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.14) 0%, #0f172a 100%);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.18);
    }

    .equip-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--border-subtle);
      color: var(--text-main);
      width: fit-content;
    }

    .equip-card.selected .equip-badge {
      background: var(--accent-gold);
      color: #0f172a;
    }

    .equip-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .equip-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* System Broadcast */
    .broadcast-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .broadcast-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .broadcast-text {
      font-size: 0.98rem;
      color: var(--text-main);
    }

    .highlight-tag {
      color: var(--accent-gold);
      font-weight: 700;
    }

    .skill-status-pill {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-gold-soft);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .skill-status-pill.used {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }

    .player-col h3 {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-num {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .score-player {
      color: var(--accent-green);
    }

    .score-cpu {
      color: var(--accent-red);
    }

    .pips {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #475569;
      transition: all 0.25s;
    }

    .pip.active-player {
      background: var(--accent-green);
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .pip.active-cpu {
      background: var(--accent-red);
      border-color: var(--accent-red);
      box-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }

    .round-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    /* Battle Arena */
    .arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #0f172a;
      border: 1px dashed var(--border-subtle);
      border-radius: 14px;
      padding: 18px 12px;
      margin-bottom: 20px;
      min-height: 126px;
    }

    .fighter-box {
      text-align: center;
      width: 120px;
    }

    .fighter-hand {
      font-size: 3rem;
      line-height: 1.2;
      transition: transform 0.2s;
    }

    .fighter-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .vs-text {
      font-weight: 900;
      font-size: 1.2rem;
      color: #64748b;
    }

    .round-banner {
      text-align: center;
      font-weight: 700;
      font-size: 1.02rem;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-main);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .round-banner.win {
      background: var(--accent-green-soft);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .round-banner.lose {
      background: var(--accent-red-soft);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .round-banner.skill {
      background: var(--accent-gold-soft);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }

    /* Action Buttons */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .choice-btn {
      background: #0f172a;
      border: 2px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 10px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--accent-blue);
      background: #172554;
      transform: translateY(-3px);
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .choice-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .choice-emoji {
      font-size: 2.2rem;
    }

    .choice-text {
      font-size: 1rem;
      font-weight: 700;
    }

    /* Final Result Box */
    .result-panel {
      text-align: center;
      padding: 22px;
      border-radius: 14px;
      margin-top: 16px;
      border: 2px solid var(--accent-gold);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, #0f172a 100%);
    }

    .result-panel h2 {
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .result-panel p {
      font-size: 1.05rem;
      margin-bottom: 18px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-secondary {
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* Console Log */
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-box {
      background: #090d16;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      height: 230px;
      overflow-y: auto;
      font-family: "JetBrains Mono", "Fira Code", "Consolas", "Noto Sans TC", monospace;
      font-size: 0.86rem;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .log-entry {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.45);
    }

    .log-entry:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pop {
      0% { transform: scale(0.75); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .pop-anim {
      animation: pop 0.28s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✊✋✌️ 剪刀石頭布 終極大對決</h1>
      <p>規則：先獲得 5 勝的一方就是最終贏家！善用你的特殊裝備逆轉戰局</p>
    </header>

    <!-- 階段一：冒險者登入與選擇特殊裝備 -->
    <section id="setup-screen" class="card">
      <div class="section-title">🧙‍♂️ 冒險者登入</div>
      <div class="form-group">
        <label for="player-name">請輸入你的冒險者名字：</label>
        <input
          type="text"
          id="player-name"
          class="name-input"
          placeholder="例如：于絜"
          maxlength="20"
        />
      </div>

      <div class="section-title">🛡️ 請選擇你的特殊裝備 (三選一)</div>
      <div class="equip-grid" id="equip-grid">
        <div class="equip-card selected" data-choice="1" onclick="selectEquipment('1')">
          <span class="equip-badge">裝備 1</span>
          <div class="equip-name">⏳ 回到過去</div>
          <div class="equip-desc">如果輸了該回合不算，電腦不加分。</div>
        </div>

        <div class="equip-card" data-choice="2" onclick="selectEquipment('2')">
          <span class="equip-badge">裝備 2</span>
          <div class="equip-name">👑 我才是贏家</div>
          <div class="equip-desc">當電腦達到 4 勝時，可讓電腦減少 1 分（限觸發一次）。</div>
        </div>

        <div class="equip-card" data-choice="3" onclick="selectEquipment('3')">
          <span class="equip-badge">裝備 3</span>
          <div class="equip-name">⚡ 分數乘二</div>
          <div class="equip-desc">如果第 1 回合贏的話直接得 2 分。</div>
        </div>
      </div>

      <button class="btn-primary" onclick="startGame()">⚔️ 裝備完成，開始猜拳挑戰！</button>
    </section>

    <!-- 階段二：對決主畫面 -->
    <section id="game-screen" class="hidden">
      <div class="broadcast-box">
        <div class="broadcast-header">=== 📢 系統廣播 ===</div>
        <div class="broadcast-text" id="broadcast-msg"></div>
        <div class="skill-status-pill" id="skill-status-pill"></div>
      </div>

      <div class="card">
        <!-- 計分板 -->
        <div class="scoreboard">
          <div class="player-col">
            <h3 id="scoreboard-player-name">你</h3>
            <div class="score-num score-player" id="player-score">0</div>
            <div class="pips" id="player-pips">
              <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
            </div>
          </div>

          <div>
            <div class="round-badge" id="round-display">第 1 回合</div>
          </div>

          <div class="player-col">
            <h3>🤖 電腦</h3>
            <div class="score-num score-cpu" id="cpu-score">0</div>
            <div class="pips" id="cpu-pips">
              <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
            </div>
          </div>
        </div>

        <!-- 出拳動畫區 -->
        <div class="arena">
          <div class="fighter-box">
            <div class="fighter-hand" id="player-hand">❔</div>
            <div class="fighter-label" id="player-choice-label">等待你出拳</div>
          </div>
          <div class="vs-text">VS</div>
          <div class="fighter-box">
            <div class="fighter-hand" id="cpu-hand">🤖</div>
            <div class="fighter-label" id="cpu-choice-label">電腦準備中</div>
          </div>
        </div>

        <!-- 當回合結果提示 -->
        <div class="round-banner" id="round-banner">
          請點擊下方按鈕出拳（剪刀、石頭 或 布）！
        </div>

        <!-- 出拳按鈕 -->
        <div class="controls" id="controls-area">
          <button class="choice-btn" onclick="playRound('剪刀')">
            <span class="choice-emoji">✌️</span>
            <span class="choice-text">剪刀</span>
          </button>
          <button class="choice-btn" onclick="playRound('石頭')">
            <span class="choice-emoji">✊</span>
            <span class="choice-text">石頭</span>
          </button>
          <button class="choice-btn" onclick="playRound('布')">
            <span class="choice-emoji">✋</span>
            <span class="choice-text">布</span>
          </button>
        </div>

        <!-- 最終結算區塊 -->
        <div id="result-panel" class="result-panel hidden">
          <h2>=== 🌟 最終結果 🌟 ===</h2>
          <p id="final-result-text"></p>
          <div class="btn-row">
            <button class="btn-primary" style="width: auto; padding: 11px 22px; margin-top: 0;" onclick="restartSameSetup()">
              🔄 再戰一局（保留裝備）
            </button>
            <button class="btn-secondary" onclick="backToSetup()">
              🛡️ 更換名字或裝備
            </button>
          </div>
        </div>
      </div>

      <!-- 戰鬥紀錄終端機 -->
      <div class="card">
        <div class="log-header">
          <div class="section-title" style="margin-bottom: 0;">📜 冒險對戰紀錄</div>
          <button class="btn-secondary" style="padding: 5px 12px; font-size: 0.8rem;" onclick="backToSetup()">重新設定</button>
        </div>
        <div class="log-box" id="battle-log"></div>
      </div>
    </section>
  </div>

  <script>
    const EQUIPMENT_INFO = {
      "1": {
        name: "回到過去",
        desc: "如果輸了該回合不算，電腦不加分"
      },
      "2": {
        name: "我才是贏家",
        desc: "當電腦達到 4 勝時，可讓電腦減少 1 分"
      },
      "3": {
        name: "分數乘二",
        desc: "如果第 1 回合贏的話直接得 2 分"
      }
    };

    const HAND_EMOJI = {
      "剪刀": "✌️",
      "石頭": "✊",
      "布": "✋"
    };

    const OPTIONS = ["剪刀", "石頭", "布"];

    let state = {
      name: "冒險者",
      equipChoice: "1",
      playerWins: 0,
      computerWins: 0,
      roundNum: 1,
      usedWinnerSkill: false,
      gameOver: false
    };

    function selectEquipment(choice) {
      state.equipChoice = choice;
      document.querySelectorAll(".equip-card").forEach(card => {
        card.classList.toggle("selected", card.dataset.choice === choice);
      });
    }

    function startGame() {
      const rawName = document.getElementById("player-name").value.trim();
      state.name = rawName || "無名冒險者";
      resetBattleState();

      document.getElementById("setup-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
    }

    function restartSameSetup() {
      resetBattleState();
    }

    function backToSetup() {
      document.getElementById("game-screen").classList.add("hidden");
      document.getElementById("setup-screen").classList.remove("hidden");
    }

    function resetBattleState() {
      state.playerWins = 0;
      state.computerWins = 0;
      state.roundNum = 1;
      state.usedWinnerSkill = false;
      state.gameOver = false;

      const equipName = EQUIPMENT_INFO[state.equipChoice].name;

      document.getElementById("scoreboard-player-name").textContent = `🧙‍♂️ ${state.name}`;
      document.getElementById("broadcast-msg").innerHTML =
        `歡迎勇敢的冒險者<span class="highlight-tag">【${escapeHtml(state.name)}】</span>！<br>` +
        `你已經裝備了<span class="highlight-tag">【${equipName}】</span>，準備好迎接第一關的 <span class="highlight-tag">【猜拳】</span> 挑戰！`;

      document.getElementById("player-hand").textContent = "❔";
      document.getElementById("cpu-hand").textContent = "🤖";
      document.getElementById("player-choice-label").textContent = "等待你出拳";
      document.getElementById("cpu-choice-label").textContent = "電腦準備中";

      const banner = document.getElementById("round-banner");
      banner.className = "round-banner";
      banner.textContent = "請點擊下方按鈕出拳（剪刀、石頭 或 布）！";

      document.getElementById("result-panel").classList.add("hidden");
      setChoiceButtonsDisabled(false);

      const logBox = document.getElementById("battle-log");
      logBox.innerHTML = "";
      appendLog(
        `=== 系統廣播 ===
歡迎勇敢的冒險者【${state.name}】！
你已經裝備了【${equipName}】，準備好迎接第一關的 【猜拳】 挑戰！

=== ✊✋✌️ 剪刀石頭布 終極大對決 ===
規則：先獲得 5 勝的一方就是最終贏家！`
      );

      updateUI();
    }

    function playRound(playerChoice) {
      if (state.gameOver) return;

      const currentRound = state.roundNum;
      const computerChoice = OPTIONS[Math.floor(Math.random() * OPTIONS.length)];

      // 更新出拳視覺
      const pHand = document.getElementById("player-hand");
      const cHand = document.getElementById("cpu-hand");
      pHand.textContent = HAND_EMOJI[playerChoice];
      cHand.textContent = HAND_EMOJI[computerChoice];
      triggerPop(pHand);
      triggerPop(cHand);

      document.getElementById("player-choice-label").textContent = `你出了：${playerChoice}`;
      document.getElementById("cpu-choice-label").textContent = `電腦出了：${computerChoice}`;

      let logLines = [
        `--- 第 ${currentRound} 回合 ---`,
        `🏆 戰前狀況 - 你：${state.playerWins} 勝 | 電腦：${state.computerWins} 勝`,
        `你出了：${playerChoice} ｜ 🤖 電腦出了：${computerChoice}`
      ];

      const banner = document.getElementById("round-banner");
      banner.className = "round-banner";

      // 勝負判斷與裝備技能（完全對應原 Python 邏輯）
      if (playerChoice === computerChoice) {
        const msg = "平手！沒有人得分。";
        banner.textContent = msg;
        logLines.push(msg);
      } else if (
        (playerChoice === "剪刀" && computerChoice === "布") ||
        (playerChoice === "石頭" && computerChoice === "剪刀") ||
        (playerChoice === "布" && computerChoice === "石頭")
      ) {
        if (state.equipChoice === "3" && currentRound === 1) {
          const msg = "🎉 第 1 回合獲勝！觸發【分數乘二】裝備效果，直接獲得 2 分！";
          state.playerWins += 2;
          banner.classList.add("skill");
          banner.textContent = msg;
          logLines.push(msg);
        } else {
          const msg = "🎉 這回合你贏了！";
          state.playerWins += 1;
          banner.classList.add("win");
          banner.textContent = msg;
          logLines.push(msg);
        }
      } else {
        if (state.equipChoice === "1") {
          const msg = "💥 這回合原本電腦贏了，但觸發【回到過去】裝備效果，電腦不加分！";
          banner.classList.add("skill");
          banner.textContent = msg;
          logLines.push(msg);
        } else {
          let msg = "💥 這回合電腦贏了！";
          state.computerWins += 1;
          banner.classList.add("lose");
          logLines.push(msg);

          if (state.equipChoice === "2" && state.computerWins === 4 && !state.usedWinnerSkill) {
            const skillMsg = "⚠️ 電腦達到 4 勝！觸發【我才是贏家】裝備效果，電腦分數減少 1 分！";
            state.computerWins -= 1;
            state.usedWinnerSkill = true;
            banner.className = "round-banner skill";
            msg = `${msg} ${skillMsg}`;
            logLines.push(skillMsg);
          }
          banner.textContent = msg;
        }
      }

      state.roundNum += 1;
      appendLog(logLines.join("
"));
      updateUI();

      // 檢查是否達成 5 勝結算條件
      if (state.playerWins >= 5 || state.computerWins >= 5) {
        finishGame();
      }
    }

    function finishGame() {
      state.gameOver = true;
      setChoiceButtonsDisabled(true);

      let finalMsg = "";
      if (state.playerWins >= 5) {
        finalMsg = `🏆 恭喜你以 ${state.playerWins} : ${state.computerWins} 擊敗了電腦，成為剪刀石頭布大師！`;
      } else {
        finalMsg = `💻 很可惜，電腦以 ${state.computerWins} : ${state.playerWins} 獲得了最終勝利，下次再來挑戰吧！`;
      }

      document.getElementById("final-result-text").textContent = finalMsg;
      document.getElementById("result-panel").classList.remove("hidden");
      appendLog(`=== 🌟 最終結果 🌟 ===
${finalMsg}`);
    }

    function updateUI() {
      document.getElementById("player-score").textContent = state.playerWins;
      document.getElementById("cpu-score").textContent = state.computerWins;
      document.getElementById("round-display").textContent = state.gameOver
        ? "對決結束"
        : `第 ${state.roundNum} 回合`;

      // 更新分數圓點
      const playerPips = document.querySelectorAll("#player-pips .pip");
      playerPips.forEach((pip, idx) => {
        pip.classList.toggle("active-player", idx < state.playerWins);
      });

      const cpuPips = document.querySelectorAll("#cpu-pips .pip");
      cpuPips.forEach((pip, idx) => {
        pip.classList.toggle("active-cpu", idx < state.computerWins);
      });

      // 更新裝備狀態標籤
      const pill = document.getElementById("skill-status-pill");
      pill.className = "skill-status-pill";
      if (state.equipChoice === "1") {
        pill.textContent = "🛡️ 回到過去：被動常駐生效中（輸了電腦不加分）";
      } else if (state.equipChoice === "2") {
        if (state.usedWinnerSkill) {
          pill.textContent = "👑 我才是贏家：已觸發完畢";
          pill.classList.add("used");
        } else {
          pill.textContent = "👑 我才是贏家：待機中（電腦達 4 勝自動扣 1 分）";
        }
      } else if (state.equipChoice === "3") {
        if (state.roundNum === 1 && !state.gameOver) {
          pill.textContent = "⚡ 分數乘二：第 1 回合有效！獲勝直得 2 分";
        } else {
          pill.textContent = "⚡ 分數乘二：僅限第 1 回合（已過首回合）";
          pill.classList.add("used");
        }
      }
    }

    function setChoiceButtonsDisabled(disabled) {
      document.querySelectorAll(".choice-btn").forEach(btn => {
        btn.disabled = disabled;
      });
    }

    function appendLog(text) {
      const logBox = document.getElementById("battle-log");
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.textContent = text;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function triggerPop(el) {
      el.classList.remove("pop-anim");
      void el.offsetWidth;
      el.classList.add("pop-anim");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
